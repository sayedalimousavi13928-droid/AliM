<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فضول‌یاب 😂</title>
<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#111,#4b0082);
  color:white;
  text-align:center;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.box{
  width:85%;
  max-width:500px;
  padding:35px 20px;
  background:rgba(255,255,255,.12);
  border-radius:25px;
  box-shadow:0 10px 40px rgba(0,0,0,.4);
}
h1{font-size:38px}
p{font-size:20px;line-height:1.8}
button{
  border:0;
  border-radius:15px;
  padding:15px 30px;
  font-size:20px;
  cursor:pointer;
  background:#00e676;
  color:#111;
  font-weight:bold;
}
#result{
  margin-top:25px;
  font-size:24px;
  font-weight:bold;
}
</style>
</head>

<body>
<div class="box">
  <h1>🕵️ فضول‌یاب 😂</h1>
  <p>اومدی ببینی اینجا چه خبره؟</p>
  <button onclick="showMessage()">بررسی کن 😎</button>
  <div id="result"></div>
</div>

<script>
function showMessage(){
  document.getElementById("result").innerHTML =
  "😂 گرفتمت فضول!<br><br>نگران نباش، هیچ اطلاعاتی ازت ذخیره نشد 😜";
}
</script>
</body>
</html>
